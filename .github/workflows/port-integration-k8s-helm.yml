name: Deploy port-labs/port-k8s-exporter to EKS via Helm

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Deployment cluster'
        required: true
      port_context:
        required: true
        description: "Action and general context (blueprint, run id, etc...)"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # ← allows the job to request an OIDC token
      contents: read   # ← required to access the repo?

    steps:
    - name: Extract cluster name and region from arn
      run: |
        cluster_arn=$(echo "${{ github.event.inputs.cluster }}" | awk -F/ '{print $NF}')
        cluster_name=$(echo "${cluster_arn}" | awk -F: '{print $NF}')
        cluster_region=$(echo "${{ github.event.inputs.cluster }}" | awk -F: '{print $4}')

        echo "CLUSTER_NAME=$cluster_name" >> $GITHUB_ENV
        echo "CLUSTER_REGION=$cluster_region" >> $GITHUB_ENV

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }} # should be set from target cluster region

    # NOTE: This role should really not be hardcoded
    - name: Configure AWS credentials (assume eks deploy role)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::496973234569:role/k8s-deployers-gha
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to EKS
      run: |
        aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.CLUSTER_REGION }}

        # stateKey: Change the stateKey to describe your integration
        helm repo add --force-update port-labs https://port-labs.github.io/helm-charts
        helm upgrade --install port-k8s-exporter port-labs/port-k8s-exporter \
          --create-namespace --namespace port-k8s-exporter \
          --set secret.secrets.portClientId="${{ secrets.PORT_CLIENT_ID }}"  \
          --set secret.secrets.portClientSecret="${{ secrets.PORT_CLIENT_SECRET }}"  \
          --set portBaseUrl="https://api.port.io"  \
          --set stateKey="port-k8s-exporter"  \
          --set eventListener.type="POLLING"  \
          --set "extraEnv[0].name"="${{ env.CLUSTER_NAME }}"  \
          --set "extraEnv[0].value"="port-k8s-exporter" 
      shell: bash
